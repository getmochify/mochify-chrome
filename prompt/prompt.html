<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Mochify</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #FFF5F7 0%, #FDFBF7 55%, #FFF0F5 100%);
      font-family: 'Quicksand', system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
      overflow: hidden;
    }

    .card {
      width: 100%;
      border-radius: 24px;
      background: linear-gradient(135deg, rgba(255,255,255,0.42) 0%, rgba(255,255,255,0.14) 100%);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255,255,255,0.45);
      box-shadow:
        0 8px 32px rgba(240,98,146,0.15),
        inset 0 1px 0 rgba(255,255,255,0.65),
        inset 0 -1px 0 rgba(255,255,255,0.1);
      overflow: hidden;
      position: relative;
    }

    .shine {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 2px;
      background: linear-gradient(to right, transparent, rgba(255,255,255,0.85), transparent);
      z-index: 1;
      pointer-events: none;
    }

    /* ── Header ───────────────────────────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px 10px;
    }

    .preview-bubble {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      overflow: hidden;
      flex-shrink: 0;
      padding: 3px;
      background: rgba(255,255,255,0.28);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.55);
      box-shadow:
        inset 0 2px 4px rgba(255,255,255,0.65),
        inset 0 -2px 4px rgba(0,0,0,0.04),
        0 4px 12px rgba(240,98,146,0.1);
    }

    .preview-bubble img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 9px;
      display: block;
    }

    .header-meta { flex: 1; min-width: 0; }

    .brand {
      font-size: 11px;
      font-weight: 800;
      color: #F06292;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      line-height: 1;
      margin-bottom: 3px;
    }

    .src-host {
      font-size: 10px;
      font-weight: 600;
      color: #875F42;
      opacity: 0.5;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── Input row ────────────────────────────────────────────────── */
    .input-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 2px 16px 14px;
    }

    input[type="text"] {
      flex: 1;
      border: none;
      background: transparent;
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 600;
      color: #4A2C2C;
      line-height: 1.55;
      outline: none;
      padding: 6px 0;
      min-width: 0;
    }

    input[type="text"]::placeholder {
      color: #875F42;
      opacity: 0.38;
      font-weight: 500;
    }

    .send-btn {
      flex-shrink: 0;
      width: 44px;
      height: 44px;
      border-radius: 14px;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .send-btn:not(:disabled) {
      background: linear-gradient(135deg, #FF9EBB, #F06292);
      color: #fff;
      box-shadow:
        inset 0 2px 4px rgba(255,255,255,0.8),
        0 4px 16px rgba(240,98,146,0.4);
    }

    .send-btn:not(:disabled):hover {
      box-shadow:
        inset 0 2px 4px rgba(255,255,255,0.9),
        0 8px 24px rgba(240,98,146,0.6);
      transform: translateY(-1px);
    }

    .send-btn:disabled {
      background: rgba(255,255,255,0.5);
      color: rgba(240,98,146,0.28);
      border: 1px solid rgba(255,255,255,0.6);
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
      cursor: not-allowed;
    }

    /* ── Footer ───────────────────────────────────────────────────── */
    .footer {
      border-top: 1px solid rgba(255,255,255,0.32);
      background: rgba(255,249,244,0.82);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .progress-track {
      height: 3px;
      background: rgba(255,255,255,0.22);
      overflow: hidden;
      display: none;
    }

    .progress-pulse {
      height: 100%;
      background: linear-gradient(to right, #F06292, #e040a0);
      opacity: 0.65;
      animation: pulse-bar 1.4s ease-in-out infinite;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(to right, #F06292, #e040a0);
      box-shadow: 0 0 10px rgba(240,98,146,0.5);
      transition: width 0.3s ease-out;
      display: none;
    }

    .footer-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 16px;
    }

    /* With a CTA the two never fit on one line: the message wraps and the button
       gets crushed against the edge. Stack instead — message across the full
       width, action beneath it on the right. */
    .footer-inner.has-cta {
      flex-direction: column;
      align-items: stretch;
      gap: 7px;
      padding-bottom: 10px;
    }
    .footer-inner.has-cta .cta-btn { align-self: flex-end; }

    .status-text {
      font-size: 11px;
      font-weight: 600;
      color: #875F42;
      opacity: 0.7;
      transition: color 0.2s;
      min-width: 0;
      line-height: 1.45;
    }

    .status-text.error  { color: #e53935; opacity: 1; }
    .status-text.success { color: #388e3c; opacity: 1; }

    .hint-badge {
      font-size: 10px;
      font-weight: 700;
      color: rgba(46,92,49,0.7);
      background: #e8f5e9;
      padding: 3px 7px;
      border-radius: 6px;
      border: 1px solid rgba(200,230,201,0.55);
      letter-spacing: 0.02em;
    }

    .cta-btn {
      font-size: 10px;
      font-weight: 800;
      color: #fff;
      background: linear-gradient(135deg, #FF9EBB, #F06292);
      padding: 4px 10px;
      border: none;
      border-radius: 7px;
      cursor: pointer;
      letter-spacing: 0.02em;
      white-space: nowrap;
      flex: none;
      box-shadow: 0 2px 8px rgba(240,98,146,0.35);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .cta-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(240,98,146,0.5); }

    /* ── Animations ───────────────────────────────────────────────── */
    /* Destination toggle — only shown when the account has a Drive connected. */
    /* Lives in the footer band with the status line, not floating between the
       input and the divider. */
    .dest-row {
      display: none;
      align-items: center;
      gap: 8px;
      padding: 9px 16px 1px;
    }
    .dest-row.on { display: flex; }

    /* border-box, so the 1px border doesn't push the knob off centre — the
       track's inner box is exactly 2px taller than the knob. */
    .dest-switch {
      box-sizing: border-box;
      position: relative;
      width: 32px;
      height: 18px;
      border-radius: 999px;
      border: 1px solid rgba(135,95,66,0.22);
      background: rgba(135,95,66,0.14);
      cursor: pointer;
      padding: 0;
      flex: none;
      transition: background 0.18s, border-color 0.18s;
    }
    .dest-switch::after {
      content: "";
      position: absolute;
      top: 1px;
      left: 1px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 2px rgba(0,0,0,0.22);
      transition: transform 0.18s;
    }
    .dest-switch[aria-checked="true"] {
      background: linear-gradient(135deg, #FF9EBB, #F06292);
      border-color: rgba(240,98,146,0.45);
    }
    .dest-switch[aria-checked="true"]::after { transform: translateX(14px); }

    .dest-label {
      font-family: 'Quicksand', system-ui, sans-serif;
      font-size: 11px;
      font-weight: 600;
      color: #875F42;
      opacity: 0.75;
      cursor: pointer;
      user-select: none;
    }
    .dest-row.on:hover .dest-label { opacity: 1; }

    /* Connected but not usable — inert switch, and the label is the way out. */
    .dest-row.broken .dest-switch {
      opacity: 0.45;
      cursor: default;
      background: rgba(135,95,66,0.12);
    }
    .dest-row.broken .dest-label {
      color: #c2410c;
      opacity: 1;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes pulse-bar {
      0%, 100% { opacity: 0.65; }
      50%       { opacity: 0.28; }
    }

    .spinning { animation: spin 0.9s linear infinite; }
  </style>
</head>
<body>
  <div class="card">
    <div class="shine"></div>

    <div class="header">
      <div class="preview-bubble">
        <img id="preview" alt="" />
      </div>
      <div class="header-meta">
        <div class="brand">Mochify</div>
        <div class="src-host" id="src-label"></div>
      </div>
    </div>

    <div class="input-row">
      <input type="text" id="prompt"
        placeholder="Make 1:1 square, remove bg, convert to AVIF…"
        autofocus />
      <button class="send-btn" id="btn" disabled>
        <svg id="btn-icon" width="18" height="18" fill="none" stroke="currentColor"
          viewBox="0 0 24 24" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M6 12L3.269 3.126A59.768 59.768 0 0121.485 12 59.77 59.77 0 013.27 20.876L5.999 12zm0 0h7.5"/>
        </svg>
      </button>
    </div>

    <div class="footer">
      <div class="progress-track" id="progress-track">
        <div class="progress-pulse" id="progress-pulse"></div>
        <div class="progress-fill"  id="progress-fill"></div>
      </div>
      <div class="dest-row" id="dest-row">
        <button class="dest-switch" id="dest-switch" role="switch" aria-checked="false"
          aria-label="Save to Google Drive"></button>
        <label class="dest-label" id="dest-label" for="dest-switch">Save to Google Drive</label>
      </div>
      <div class="footer-inner">
        <span class="status-text" id="status">Describe what you want…</span>
        <span class="hint-badge" id="hint-badge">↵</span>
        <button class="cta-btn" id="cta" style="display:none"></button>
      </div>
    </div>
  </div>

  <script src="prompt.js"></script>
</body>
</html>
